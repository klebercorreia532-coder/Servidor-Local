# schema/orcamento.yaml

components:
  schemas:

orcamento:
  type: object
  properties:
    id:
      type: integer
      example: 1
    total:
      type: string
      example: 200.00
    id_utilizador:
      type: string
      example: e54f3cee-4997-49fc-ace8-833d0884b8cc
    enabled:
      type: boolean
      example: true
    created_at:
      type: 2026-03-11 10:01:12
      format: date-time
      example: "2026-03-11 10:01:12"
    updated_at:
      type: 2026-03-11 10:01:12
      format: date-time
      example: "2026-03-11 10:01:12"

# schema para criar um novo orcamento
CreateOrcamento:
  type: object
  properties:
    total:
      type: string
      example: 200.00
    id_utilizador:
      type: string
      example: e54f3cee-4997-49fc-ace8-8
    enabled:
      type: boolean
      example: true
  required:
    - total
    - id_utilizador
    - enabled

# schema genérico para sucesso
responseSucesso:
  type: object
  properties:
    message:
      type: string
      example: Orcamento criado com sucesso
    status:
      type: boolean
      example: true
    data:
      $ref: "#/components/schemas/orcamento"

# schema genérico de erro
responseErro:
  type: object
  properties:
    message:
      type: string
      example: Erro ao processar a requisição
    status:
      type: boolean
      example: false
    data:
      type: object
      null: true


