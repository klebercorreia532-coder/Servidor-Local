# paths/user.yaml

paths:
  /users:
    get:
      summary: Listar todos os use
      description: Retorna a lista de todos os use disponíveis
      responses:
        "200":
          description: Lista de use
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/user"

        "404":
          description: user não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseErro"

  /user/create:
    post:
      summary: Criar um novo user
      description: Criar um novo user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Createuser"
      responses:
        "200":
          description: user criado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/responseSucesso"

        "400":
          description: dados invalidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/responseErro"

  /user/get-by-id/{id}:
    get:
      summary: Buscar um user por ID
      description: Retorna um user específico pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do user
          schema:
            type: integer
            example:  4bb7ab97-8c95-4c85-9571-193e7efdc359
      responses:
        "200":
          description: user encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"

        "404":
          description: user não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseErro"

  /user/update/{id}:
    put:
      summary: Atualizar um user
      description: Atualiza um user existente pelo ID
      parameters:
        - nome: id
          in: path
          required: true
          description: ID do user a ser atualizado
          schema:
            type: integer
            example:  4bb7ab97-8c95-4c85-9571-193e7efdc359
      requestBody:
        required: true
        content:
          application/json:
            schema:
            type: object
            $ref: "#/components/schemas/createUser"
      responses:
        "200":
          description: atualizados com sucesso
          content: 
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/user"
            
        "400":
          description: Dados invalidos
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/user"

        "404":
          description: user não encontrado
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/responseErro"
  /user/delete/{id}:
    delete:
      summary: Deletar um user
      description: Deleta um user expicifico pelo ID
      parameters:
        - nome: id
          in: path
          required: true
          description: ID do user a ser deletado
          schema:
            type: integer
            example:  4bb7ab97-8c95-4c85-9571-193e7efdc359
      responses:
        "200":
          description: user deletado com sucesso
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/responseSucesso"
        "404":
          description: user não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/responseErro"









